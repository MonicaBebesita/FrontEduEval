<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Competencias del Programa</h2>
    
    <!-- Botón para crear una nueva competencia -->
    <!-- TODO: Agregar routerLink a ruta de creación -->
    <button class="btn btn-primary" [routerLink]="['/programa/crear']">
      <i class="bi bi-plus-lg me-1"></i> Crear Competencia
    </button>
  </div>

  <table class="table table-bordered table-striped align-middle">
    <thead class="table-dark">
      <tr>
        <th>#</th>
        <th>Descripción</th>
        <th>Nivel</th>
        <th class="text-center">Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let competencia of competencias">
        <td>{{ competencia.id }}</td>
        <td>{{ competencia.descripcion }}</td>
        <td class="text-capitalize">{{ competencia.nivel }}</td>
        <td class="text-center">
          
          <!-- Ver competencia -->
          <!-- TODO: Agregar routerLink a /programa/ver/:id -->
          <button class="btn btn-outline-info btn-sm me-1"
                  [routerLink]="['/programa/ver', competencia.id]">
            <i class="bi bi-eye"></i>
          </button>

          <!-- Editar competencia -->
          <!-- TODO: Agregar routerLink a /programa/editar/:id -->
          <button class="btn btn-outline-warning btn-sm me-1"
                  [routerLink]="['/programa/editar', competencia.id]">
            <i class="bi bi-pencil"></i>
          </button>

          <!-- Añadir resultado de aprendizaje -->
          <!-- TODO: Agregar routerLink a /programa/ra/:id -->
          <button class="btn btn-outline-success btn-sm me-1"
                  [routerLink]="['/programa/ra', competencia.id]"
                  title="Agregar resultado de aprendizaje">
            RA
          </button>

          <!-- Eliminar competencia -->
          <!-- TODO: Vincular a método eliminarCompetencia(competencia.id) -->
          <button class="btn btn-outline-danger btn-sm"
                  >
            <i class="bi bi-trash"></i>
          </button>

        </td>
      </tr>
    </tbody>
  </table>
</div>
