<div class="container mt-4">
  <h3>
    Añadir RA a la competencia: <strong>{{ competenciaDestino }}</strong>
  </h3>

  <div class="d-flex justify-content-between align-items-center mb-3">
    <button class="btn btn-success" (click)="prepararNuevoRA()">
      <i class="bi bi-plus-circle"></i> Crear nuevo RA
    </button>

    <div class="input-group w-auto">
      <span class="input-group-text">Filtrar por fecha</span>
      <input
        type="date"
        class="form-control"
        [(ngModel)]="fechaFiltro"
        (change)="filtrarPorFecha()"
      />
    </div>
  </div>

  <!-- Lista de RAs -->
  <div *ngIf="rasFiltrados.length > 0; else noRA">
    <div class="list-group">
      <div
        class="list-group-item list-group-item-action d-flex justify-content-between align-items-start"
        *ngFor="let ra of rasFiltrados"
      >
        <div class="ms-2 me-auto">
          <div class="fw-bold">{{ ra.descripcion }}</div>
          <small>Creado el: {{ ra.fecha }}</small>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline-primary btn-sm" (click)="copiarRA(ra)">
            <i class="bi bi-clipboard-plus"></i> Copiar a competencia
          </button>
          <button
            class="btn btn-outline-secondary btn-sm"
            (click)="editarRA(ra)"
          >
            <i class="bi bi-pencil"></i>
          </button>
          <button
            class="btn btn-outline-danger btn-sm"
            (click)="eliminarRA(ra)"
          >
            <i class="bi bi-trash"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Si no hay RA -->
  <ng-template #noRA>
    <div class="alert alert-warning">
      No hay RAs para esta asignatura con ese filtro de fecha.
    </div>
  </ng-template>

  <!-- Modal controlado con Angular -->
  <div
    class="modal fade"
    [class.show]="mostrarModalCrear"
    [style.display]="mostrarModalCrear ? 'block' : 'none'"
    *ngIf="mostrarModalCrear"
    role="dialog"
    aria-modal="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <form (ngSubmit)="guardarNuevoRA()" #formRA="ngForm">
          <div class="modal-header">
            <h5 class="modal-title">Crear nuevo Resultado de Aprendizaje</h5>
            <button
              type="button"
              class="btn-close"
              aria-label="Cerrar"
              (click)="cerrarModalCrear()"
            ></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="descripcionRA" class="form-label">Descripción</label>
              <textarea
                class="form-control"
                id="descripcionRA"
                required
                [(ngModel)]="nuevoRA.descripcion"
                name="descripcionRA"
                rows="3"
              ></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="submit"
              class="btn btn-primary"
              [disabled]="!formRA.form.valid"
            >
              Guardar RA
            </button>
            <button
              type="button"
              class="btn btn-secondary"
              (click)="cerrarModalCrear()"
            >
              Cancelar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Fondo oscuro del modal -->
  <div
    class="modal-backdrop fade"
    [class.show]="mostrarModalCrear"
    *ngIf="mostrarModalCrear"
  ></div>
</div>
