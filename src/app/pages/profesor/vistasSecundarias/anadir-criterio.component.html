<div class="container mt-4">
  <h4>Añadir Criterio a Rúbrica {{ rubricaId }}</h4>
  <form (ngSubmit)="guardar()">
    <div class="mb-3">
      <label for="descripcion" class="form-label">Descripción del criterio</label>
      <textarea
        id="descripcion"
        class="form-control"
        [(ngModel)]="criterio.descripcion"
        name="descripcion"
        required
        placeholder="Ej: Justificación teórica sólida y coherente."
      ></textarea>
    </div>

    <div class="mb-3">
      <label for="ponderacion" class="form-label">Ponderación (%)</label>
      <input
        type="number"
        id="ponderacion"
        class="form-control"
        [(ngModel)]="criterio.ponderado"
        name="ponderacion"
        required
        min="0"
        max="100"
      />
      <small class="form-text text-muted">Ingresa un valor entre 0 y 100.</small>
    </div>

    <div class="mb-3">
      <label for="nivel" class="form-label">Nivel de desempeño</label>
      <select
        id="nivel"
        class="form-select"
        [(ngModel)]="criterio.nivel"
        name="nivel"
        required
      >
        <option *ngFor="let nivelOpt of nivelesOpciones" [value]="nivelOpt.value">
          {{ nivelOpt.label }} (Nivel {{ nivelOpt.value }})
        </option>
      </select>
      <small class="form-text text-muted">Selecciona el nivel de este criterio (Básico, Medio, Avanzado).</small>
    </div>

    <div class="mt-4">
      <button type="submit" class="btn btn-primary me-2">Guardar Criterio</button>
      <a class="btn btn-secondary" [routerLink]="['/profesor/rubricas', rubricaId]">Cancelar</a>
    </div>
  </form>
</div>
