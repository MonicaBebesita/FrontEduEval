<fieldset class="border p-3 rounded">
  <legend class="float-none w-auto px-3">Nueva competencia y RA</legend>
  <form #form="ngForm" (ngSubmit)="onSubmit(form)" unvaliate>
    <div class="row mb-3">
      <div class="col-md-6">
        <app-input
          label="Descripción"
          [(ngModel)]="descripcion"
          name="descripcion"
          [minlength]="10"
          [required]="true"
          [formResetTrigger]="formResetToggle"
        />
      </div>
    </div>
    <div class="row mb-3">
      <div class="col-md-6">
        <app-input
          label="Descripción del RA"
          [(ngModel)]="descripcionRA"
          name="descripcionRA"
          [minlength]="10"
          [required]="true"
          [formResetTrigger]="formResetToggle"
        />
      </div>
      <div class="col-md-6">
        <app-select
          label="Nivel"
          [(ngModel)]="nivel"
          name="nivel"
          [options]="niveles"
          [required]="true"
          [formResetTrigger]="formResetToggle"
        ></app-select>
      </div>
    </div>

    <div *ngIf="mostrarVinculacion" class="mb-3">
      <label class="form-label">Vincular con Competencias de Programa</label>
      <div class="form-check" *ngFor="let cp of competenciasPrograma">
        <input
          type="checkbox"
          class="form-check-input"
          [id]="'cp-' + cp.id"
          [value]="cp.id"
          [checked]="competenciasSeleccionadas.includes(cp.id)"
          (change)="onCheckboxChange($event, cp.id)"
        />
        <label class="form-check-label" [for]="'cp-' + cp.id">
          {{ cp.descripcion }}
        </label>
      </div>
    </div>

    <app-button btnClass="btn btn-primary" type="submit">Crear</app-button>
    <app-button btnClass="btn btn-secondary ms-2" [routerLink]="['/asignatura']" type="button">Volver</app-button>
  </form>

  <div *ngIf="mensajeExito" class="alert alert-success mt-3">
    {{ mensajeExito }}
  </div>
</fieldset>
