<div class="row">
      <div class="col-md-4" *ngFor="let asignatura of asignaturas">
        <app-asignatura-card
          [id]="asignatura.id"
          [nombre]="asignatura.nombre"
          [descripcion]="asignatura.descripcion"
          [color]="asignatura.color"
          [ruta]="rutaDestino"
        />
      </div>
    </div>
