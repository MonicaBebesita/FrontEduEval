<!-- Botón de toggle para móviles -->
<button class="btn btn-primary d-lg-none position-fixed top-0 start-0 m-2" type="button" (click)="toggleSidebar()">
  <i class="bi bi-list"></i>
</button>

<!-- Sidebar principal -->
<div 
  class="d-flex flex-column flex-shrink-0 p-3 bg-light vh-100 shadow-sm sidebar-container"
  [class.sidebar-mobile-active]="sidebarActive"
  style="width: 250px"
>
  <div class="d-flex align-items-center mb-3 text-dark fs-5">
    <i [class]="icon + ' me-2 fs-3 text-primary'"></i>
    <span class="fw-bold text-capitalize me-2">Rol:</span>

    <select
      *ngIf="userRoles.length > 0"
      class="form-select form-select-sm w-auto"
      [(ngModel)]="selectedRole"
      (change)="onRoleChange()"
    >
      <option *ngFor="let role of userRoles" [value]="role">{{ role }}</option>
    </select>
  </div>

  <hr />

  <ul class="nav nav-pills flex-column mb-auto">
    <li *ngFor="let item of menuItems" class="nav-item">
      <a
        [routerLink]="item.route"
        routerLinkActive="active"
        class="nav-link link-dark"
        (click)="closeSidebarOnMobile()"
      >
        {{ item.label }}
      </a>
    </li>
  </ul>

  <hr />
  <button class="btn btn-outline-secondary w-100" (click)="logout()">
    Cerrar sesión
  </button>
</div>

<!-- Overlay para móviles -->
<div *ngIf="sidebarActive" class="sidebar-overlay" (click)="toggleSidebar()"></div>
