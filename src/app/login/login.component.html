<div class="login-wrapper">
  <div class="logo-floating scale-up">
    <app-icon name="mortarboard-fill" customClass="icon"></app-icon>
    <span class="brand">EduEval</span>
  </div>

  <div class="login-container animate login-card">
    <h3>Inicio de sesión</h3><br>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
      <div class="input-group">
        <app-icon name="person-fill" class="input-icon"></app-icon>
        <input type="text" id="username" name="username" required [(ngModel)]="username" class="form-control"
          placeholder=" " (input)="onInputChange()" />
        <label for="username">Nombre de usuario</label>
      </div>

      <div class="input-group">
        <app-icon name="lock-fill" class="input-icon"></app-icon>
        <input type="password" id="password" name="password" required [(ngModel)]="password" class="form-control"
          placeholder=" " (input)="onInputChange()" />
        <label for="password">Contraseña</label>
      </div>

      <div *ngIf="error" class="text-danger mb-3">
        {{ error }}
      </div>

      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>

  </div>
</div>
